name: validate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Frontmatter, links, line endings, rule index, manifests
        run: python scripts/validate.py
      - name: The checks and the hook parse
        run: |
          for f in skills/kz-uicheck/checks/*.js docs/reference/*.js; do node --check "$f"; done
          node --check skills/kz-askcard/hooks/ui-rule-purpose.mjs
