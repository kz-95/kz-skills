<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orders</title>
<style>
  :root { --bg: #f7f7f8; --surface: #fff; --text: #1d1f23; --muted: #5b6170; --line: #d6d9e0; --accent: #2457c5; --hover: #eef2fb; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.5 system-ui, sans-serif; background: var(--bg); color: var(--text); }
  main { max-width: 1100px; margin: 24px auto; padding: 0 16px; }
  .table-wrap { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; }
  table { border-collapse: collapse; width: 100%; }
  th, td { padding: 8px 12px; border-bottom: 1px solid var(--line); text-align: left; white-space: nowrap; }
  th { position: sticky; top: 0; background: var(--surface); font-weight: 600; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  .th-inner { display: inline-flex; align-items: center; gap: 4px; }
  .filter-btn { font: inherit; border: 1px solid transparent; background: none; border-radius: 4px; cursor: pointer; padding: 2px 6px; color: var(--muted); }
  .filter-btn[aria-pressed="true"] { color: var(--accent); border-color: var(--accent); }
  .panel { position: absolute; z-index: 10; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 8px 24px rgba(0,0,0,.15); padding: 12px; width: 260px; }
  .panel[hidden] { display: none; }
  .panel input[type=search], .panel input[type=number] { width: 100%; font: inherit; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; }
  .panel .values { max-height: 220px; overflow: auto; margin: 8px 0; }
  .panel label { display: flex; justify-content: space-between; gap: 8px; padding: 2px 0; }
  .panel .count { color: var(--muted); font-variant-numeric: tabular-nums; }
  .panel .row { display: flex; gap: 8px; }
  .panel .links { display: flex; justify-content: space-between; margin-bottom: 8px; }
  .panel .links button { font: inherit; background: none; border: none; color: var(--accent); cursor: pointer; padding: 0; }
  .summary { color: var(--muted); margin: 8px 0; }
</style>
</head>
<body>
<main>
  <h1>Orders</h1>
  <p class="summary" id="summary"></p>
  <div class="table-wrap">
    <table id="orders">
      <thead><tr id="head"></tr></thead>
      <tbody id="body"></tbody>
    </table>
  </div>
  <div class="panel" id="panel" hidden role="dialog" aria-label="Column filter"></div>
</main>
<script>
const ORDERS = [{"id": "ORD-1001", "date": "2026-06-05", "customer": "Granite plc", "site": "Airport", "status": "Open", "amount": 821.18}, {"id": "ORD-1002", "date": "2026-09-04", "customer": "Fjord AS", "site": "Harbour", "status": "Open", "amount": 8925.94}, {"id": "ORD-1003", "date": "2026-04-02", "customer": "Birch & Co", "site": "West plant", "status": "Done", "amount": 796.2}, {"id": "ORD-1004", "date": "2026-02-18", "customer": "Granite plc", "site": "North depot", "status": "Cancelled", "amount": 1318.4}, {"id": "ORD-1005", "date": "2026-04-21", "customer": "Acme Ltd", "site": "Harbour", "status": "Cancelled", "amount": 3959.87}, {"id": "ORD-1006", "date": "2026-04-02", "customer": "Cobalt Inc", "site": "East works", "status": "Done", "amount": 1516.39}, {"id": "ORD-1007", "date": "2026-02-19", "customer": "Evergreen", "site": "Harbour", "status": "In progress", "amount": 1117.58}, {"id": "ORD-1008", "date": "2026-04-12", "customer": "Birch & Co", "site": "Harbour", "status": "Open", "amount": 5583.09}, {"id": "ORD-1009", "date": "2026-04-16", "customer": "Granite plc", "site": "East works", "status": "Done", "amount": 5788.24}, {"id": "ORD-1010", "date": "2026-08-12", "customer": "Evergreen", "site": "South yard", "status": "In progress", "amount": 6886.27}, {"id": "ORD-1011", "date": "2026-04-03", "customer": "Evergreen", "site": "Harbour", "status": "Done", "amount": 8591.33}, {"id": "ORD-1012", "date": "2026-08-10", "customer": "Birch & Co", "site": "North depot", "status": "Cancelled", "amount": 4167.43}, {"id": "ORD-1013", "date": "2026-06-05", "customer": "Helix Labs", "site": "West plant", "status": "Open", "amount": 9432.34}, {"id": "ORD-1014", "date": "2026-02-25", "customer": "Fjord AS", "site": "East works", "status": "On hold", "amount": 5873.5}, {"id": "ORD-1015", "date": "2026-08-03", "customer": "Birch & Co", "site": "East works", "status": "Done", "amount": 6867.37}, {"id": "ORD-1016", "date": "2026-02-02", "customer": "Evergreen", "site": "Airport", "status": "Cancelled", "amount": 9733.17}, {"id": "ORD-1017", "date": "2026-08-10", "customer": "Granite plc", "site": "Airport", "status": "On hold", "amount": 338.41}, {"id": "ORD-1018", "date": "2026-08-12", "customer": "Cobalt Inc", "site": "Harbour", "status": "Open", "amount": 4898.95}, {"id": "ORD-1019", "date": "2026-04-25", "customer": "Evergreen", "site": "South yard", "status": "In progress", "amount": 3971.65}, {"id": "ORD-1020", "date": "2026-08-03", "customer": "Cobalt Inc", "site": "West plant", "status": "Done", "amount": 5438.58}, {"id": "ORD-1021", "date": "2026-03-27", "customer": "Granite plc", "site": "Harbour", "status": "On hold", "amount": 6957.92}, {"id": "ORD-1022", "date": "2026-06-22", "customer": "Granite plc", "site": "South yard", "status": "In progress", "amount": 923.29}, {"id": "ORD-1023", "date": "2026-03-08", "customer": "Delta Foods", "site": "North depot", "status": "Done", "amount": 8164.99}, {"id": "ORD-1024", "date": "2026-03-09", "customer": "Evergreen", "site": "North depot", "status": "In progress", "amount": 4175.4}, {"id": "ORD-1025", "date": "2026-06-20", "customer": "Fjord AS", "site": "South yard", "status": "Cancelled", "amount": 9318.17}, {"id": "ORD-1026", "date": "2026-01-15", "customer": "Granite plc", "site": "West plant", "status": "Done", "amount": 3935.08}, {"id": "ORD-1027", "date": "2026-08-21", "customer": "Granite plc", "site": "North depot", "status": "In progress", "amount": 771.92}, {"id": "ORD-1028", "date": "2026-04-15", "customer": "Cobalt Inc", "site": "North depot", "status": "On hold", "amount": 5935.04}, {"id": "ORD-1029", "date": "2026-02-01", "customer": "Cobalt Inc", "site": "Harbour", "status": "Open", "amount": 9305.82}, {"id": "ORD-1030", "date": "2026-01-03", "customer": "Delta Foods", "site": "Harbour", "status": "Done", "amount": 1557.97}, {"id": "ORD-1031", "date": "2026-05-12", "customer": "Fjord AS", "site": "West plant", "status": "Open", "amount": 1236.62}, {"id": "ORD-1032", "date": "2026-08-15", "customer": "Helix Labs", "site": "West plant", "status": "On hold", "amount": 951.36}, {"id": "ORD-1033", "date": "2026-02-24", "customer": "Fjord AS", "site": "Airport", "status": "On hold", "amount": 4753.06}, {"id": "ORD-1034", "date": "2026-03-17", "customer": "Acme Ltd", "site": "South yard", "status": "Cancelled", "amount": 3621.76}, {"id": "ORD-1035", "date": "2026-09-01", "customer": "Evergreen", "site": "Airport", "status": "Open", "amount": 6859.18}, {"id": "ORD-1036", "date": "2026-05-17", "customer": "Fjord AS", "site": "South yard", "status": "On hold", "amount": 7592.36}, {"id": "ORD-1037", "date": "2026-09-18", "customer": "Fjord AS", "site": "Airport", "status": "In progress", "amount": 6056.05}, {"id": "ORD-1038", "date": "2026-04-26", "customer": "Delta Foods", "site": "West plant", "status": "In progress", "amount": 2055.21}, {"id": "ORD-1039", "date": "2026-08-12", "customer": "Acme Ltd", "site": "North depot", "status": "On hold", "amount": 4691.28}, {"id": "ORD-1040", "date": "2026-04-23", "customer": "Fjord AS", "site": "West plant", "status": "On hold", "amount": 9364.41}];

const COLUMNS = [
  { key: 'id', label: 'Order', type: 'text' },
  { key: 'date', label: 'Date', type: 'text' },
  { key: 'customer', label: 'Customer', type: 'values' },
  { key: 'site', label: 'Site', type: 'values' },
  { key: 'amount', label: 'Amount', type: 'range', num: true, fmt: v => v.toLocaleString('en-GB', { style: 'currency', currency: 'GBP' }) }
];

const filters = {};   // key -> Set of allowed values, or {min,max}
let sort = { key: 'date', dir: -1 };
let openKey = null;

function passes(row, skipKey) {
  return COLUMNS.every(c => {
    if (c.key === skipKey) return true;
    const f = filters[c.key];
    if (!f) return true;
    if (f instanceof Set) return f.has(String(row[c.key]));
    if (f.min != null && row[c.key] < f.min) return false;
    if (f.max != null && row[c.key] > f.max) return false;
    return true;
  });
}

function renderHead() {
  const tr = document.getElementById('head');
  tr.innerHTML = '';
  COLUMNS.forEach(c => {
    const th = document.createElement('th');
    if (c.num) th.className = 'num';
    const inner = document.createElement('span');
    inner.className = 'th-inner';
    inner.textContent = c.label;
    if (c.type !== 'text') {
      const b = document.createElement('button');
      b.className = 'filter-btn';
      b.type = 'button';
      b.setAttribute('aria-label', 'Filter ' + c.label);
      b.setAttribute('aria-pressed', filters[c.key] ? 'true' : 'false');
      b.setAttribute('aria-haspopup', 'dialog');
      b.textContent = '▾';
      b.addEventListener('click', e => { e.stopPropagation(); togglePanel(c, b); });
      inner.appendChild(b);
    }
    th.appendChild(inner);
    tr.appendChild(th);
  });
}

function renderBody() {
  const rows = ORDERS.filter(r => passes(r)).sort((a, b) => (a[sort.key] > b[sort.key] ? 1 : a[sort.key] < b[sort.key] ? -1 : 0) * sort.dir);
  const tb = document.getElementById('body');
  tb.innerHTML = rows.map(r => '<tr>' + COLUMNS.map(c => '<td' + (c.num ? ' class="num"' : '') + '>' + (c.fmt ? c.fmt(r[c.key]) : r[c.key]) + '</td>').join('') + '</tr>').join('');
  document.getElementById('summary').textContent = rows.length + ' of ' + ORDERS.length + ' orders';
}

function togglePanel(col, btn) {
  const panel = document.getElementById('panel');
  if (openKey === col.key) { closePanel(); return; }
  openKey = col.key;
  panel.innerHTML = '';
  const sortRow = document.createElement('div');
  sortRow.className = 'links';
  sortRow.innerHTML = '<button type="button" data-d="1">Sort A to Z</button><button type="button" data-d="-1">Sort Z to A</button>';
  sortRow.querySelectorAll('button').forEach(b => b.addEventListener('click', () => { sort = { key: col.key, dir: +b.dataset.d }; renderBody(); }));
  panel.appendChild(sortRow);
  if (col.type === 'values') buildValues(panel, col); else buildRange(panel, col);
  const r = btn.getBoundingClientRect();
  panel.style.top = (window.scrollY + r.bottom + 4) + 'px';
  panel.style.left = Math.min(window.scrollX + r.left, window.scrollX + document.documentElement.clientWidth - 276) + 'px';
  panel.hidden = false;
  panel.querySelector('input')?.focus();
}

function buildValues(panel, col) {
  const counts = {};
  ORDERS.filter(r => passes(r, col.key)).forEach(r => { counts[r[col.key]] = (counts[r[col.key]] || 0) + 1; });
  const all = [...new Set(ORDERS.map(r => String(r[col.key])))].sort();
  const search = document.createElement('input');
  search.type = 'search';
  search.placeholder = 'Search values';
  search.setAttribute('aria-label', 'Search ' + col.label + ' values');
  panel.appendChild(search);
  const links = document.createElement('div');
  links.className = 'links';
  links.innerHTML = '<button type="button" data-a="all">Select all</button><button type="button" data-a="none">Clear</button>';
  panel.appendChild(links);
  const list = document.createElement('div');
  list.className = 'values';
  panel.appendChild(list);
  const draw = () => {
    const q = search.value.toLowerCase();
    const sel = filters[col.key];
    list.innerHTML = '';
    all.filter(v => v.toLowerCase().includes(q)).forEach(v => {
      const l = document.createElement('label');
      const cb = document.createElement('input');
      cb.type = 'checkbox';
      cb.checked = !sel || sel.has(v);
      cb.addEventListener('change', () => {
        const s = filters[col.key] ? new Set(filters[col.key]) : new Set(all);
        cb.checked ? s.add(v) : s.delete(v);
        filters[col.key] = s.size === all.length ? undefined : s;
        update();
      });
      const span = document.createElement('span');
      span.appendChild(cb);
      span.append(' ' + v);
      const n = document.createElement('span');
      n.className = 'count';
      n.textContent = counts[v] || 0;
      l.append(span, n);
      list.appendChild(l);
    });
  };
  search.addEventListener('input', draw);
  links.querySelectorAll('button').forEach(b => b.addEventListener('click', () => {
    filters[col.key] = b.dataset.a === 'all' ? undefined : new Set();
    update(); draw();
  }));
  draw();
}

function buildRange(panel, col) {
  const f = filters[col.key] || {};
  const row = document.createElement('div');
  row.className = 'row';
  row.innerHTML = '<input type="number" aria-label="Minimum ' + col.label + '" placeholder="Min"><input type="number" aria-label="Maximum ' + col.label + '" placeholder="Max">';
  const [mn, mx] = row.querySelectorAll('input');
  mn.value = f.min ?? ''; mx.value = f.max ?? '';
  const apply = () => {
    const v = { min: mn.value === '' ? null : +mn.value, max: mx.value === '' ? null : +mx.value };
    filters[col.key] = v.min == null && v.max == null ? undefined : v;
    update();
  };
  mn.addEventListener('input', apply); mx.addEventListener('input', apply);
  panel.appendChild(row);
}

function update() { renderBody(); renderHead(); }

function closePanel() {
  const panel = document.getElementById('panel');
  panel.hidden = true;
  const key = openKey;
  openKey = null;
  const i = COLUMNS.findIndex(c => c.key === key);
  if (i >= 0) document.querySelectorAll('#head th')[i]?.querySelector('button')?.focus();
}

document.addEventListener('click', e => { if (openKey && !document.getElementById('panel').contains(e.target)) closePanel(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && openKey) closePanel(); });
window.addEventListener('resize', () => { if (openKey) closePanel(); });
window.addEventListener('scroll', e => { if (openKey && !document.getElementById('panel').contains(e.target)) closePanel(); }, true);

renderHead();
renderBody();
</script>
</body>
</html>
