<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Operations dashboard</title>
<style>
  :root { --bg: #f7f7f8; --surface: #fff; --text: #1d1f23; --muted: #5b6170; --line: #d6d9e0; --accent: #2457c5; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.5 system-ui, sans-serif; background: var(--bg); color: var(--text); }
  main { max-width: 1100px; margin: 24px auto; padding: 0 16px; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; margin-bottom: 16px; }
  .tile, .card { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 16px; }
  .tile .label { color: var(--muted); }
  .tile .value { font-size: 24px; font-weight: 600; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<main>
  <h1>Operations dashboard</h1>
  <section class="tiles" id="tiles"></section>
  <section class="card" id="charts">

</main>

</html>
